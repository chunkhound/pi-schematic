name: npm Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@11.21.0

      - name: Verify tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Version mismatch: tag=$GITHUB_REF_NAME package.json=$VERSION" >&2
            exit 1
          fi

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Security audit
        run: npx audit-ci --config audit-ci.jsonc

      - name: Unit tests
        run: npm test

      - name: Packed host contract
        run: npm run test:package-host

      - name: Check whether the version is already published
        id: registry
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if PUBLISHED=$(npm view "@chunkhound/pi-schematic@$VERSION" version 2>npm-view.err); then
            if [[ "$PUBLISHED" != "$VERSION" ]]; then
              echo "Unexpected registry version: $PUBLISHED" >&2
              exit 1
            fi
            echo "@chunkhound/pi-schematic@$VERSION is already on the registry; skipping npm publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          elif grep -q 'E404' npm-view.err; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat npm-view.err >&2
            exit 1
          fi

      - name: Publish to npm
        if: steps.registry.outputs.published == 'false'
        run: npm publish
