# Cross-platform CI for pi-schematic
#
# Runs the full unit suite on Linux, macOS, and Windows, each on the minimum
# Node.js version required by pi coding agent and on the current Node.js LTS. Snapshot tests verify TUI render output against golden files.

name: test

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore: ['**/docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/docs/**']
  workflow_dispatch:

jobs:
  # ── Cross-platform test matrix ──────────────────────────────────────
  # Every platform runs two tracks: the floor (Pi's minimum Node.js version) and the
  # current Node.js LTS, both as exact versions. Platform-specific code paths
  # (Windows shell spawning, path handling) can depend on the Node version too.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # report every combination, don't cancel
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        track: [floor, newest]
        include:
          - track: floor
            node-version: "22.19.0"
          - track: newest
            node-version: "26.13.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      # Uniform pre-flight checks — type errors and security issues on every platform.
      # audit-ci fails on moderate-or-higher advisories; reviewed exceptions, if ever
      # needed, must be explicit and expiry-tracked in audit-ci.jsonc.
      - name: Type check
        run: npx tsc --noEmit

      - name: Security audit
        run: npx audit-ci --config audit-ci.jsonc

      # Unit suite (unit tests + snapshot tests + property-based tests)
      - name: Unit tests
        run: npm test

      # E2E tests — two suites: the real-host suite runs the pi CLI in RPC mode, and the
      # line-host harness runs a child process over stdin/stdout (no PTY).
      # Issue #12 concerns the line-host harness's cross-platform run only, not the real-host suite:
      # https://github.com/chunkhound/pi-schematic/issues/12
      - name: E2E tests
        run: npm run test:e2e

      # The packed extension is exercised from a foreign cwd with the latest host.
      - name: Packed latest Pi host contract
        if: (matrix.os == 'ubuntu-latest' && matrix.track == 'floor') || matrix.os == 'windows-latest'
        working-directory: ${{ runner.temp }}
        env:
          COMPAT_ARTIFACT_DIR: ${{ runner.temp }}/packed-host-diagnostics-${{ matrix.os }}-${{ matrix.track }}
        run: node "${{ github.workspace }}/scripts/test-package-host.mjs"

      - name: Upload packed host diagnostics
        if: always() && ((matrix.os == 'ubuntu-latest' && matrix.track == 'floor') || matrix.os == 'windows-latest')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-host-diagnostics-${{ matrix.os }}-${{ matrix.track }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/packed-host-diagnostics-${{ matrix.os }}-${{ matrix.track }}
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      # Runs even when the packed-host contract step fails on Windows, so compat
      # diagnostics are captured for both the packed and current-Pi paths. !cancelled()
      # (not always()) avoids running on explicit workflow cancellation.
      - name: Synchronized current Pi compatibility on Windows
        if: matrix.os == 'windows-latest' && !cancelled() && matrix.track == 'newest'
        working-directory: ${{ runner.temp }}
        env:
          COMPAT_ARTIFACT_DIR: ${{ runner.temp }}/current-pi-diagnostics-windows-newest
        run: node "${{ github.workspace }}/scripts/test-compat-current.mjs"

      - name: Upload current Pi diagnostics on Windows
        if: always() && matrix.os == 'windows-latest' && matrix.track == 'newest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-pi-diagnostics-windows-newest-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-pi-diagnostics-windows-newest
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

      # Upload test results for debugging — artifacts available for 30 days.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.track }}
          path: |
            tests/snapshots/
          retention-days: 30

  current-pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: "npm"
      - run: npm ci
      - name: Synchronized current Pi compatibility
        working-directory: ${{ runner.temp }}
        env:
          COMPAT_ARTIFACT_DIR: ${{ runner.temp }}/current-pi-diagnostics-ubuntu-newest
        run: node "${{ github.workspace }}/scripts/test-compat-current.mjs"
      - name: Upload current Pi diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: current-pi-diagnostics-ubuntu-newest-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-pi-diagnostics-ubuntu-newest
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
